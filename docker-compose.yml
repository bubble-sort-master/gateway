version: '3.8'

services:
  auth-postgres:
    image: postgres:16-alpine
    container_name: auth-postgres
    restart: always
    environment:
      POSTGRES_DB: ${AUTH_DB}
      POSTGRES_USER: ${AUTH_USER}
      POSTGRES_PASSWORD: ${AUTH_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_USER} -d ${AUTH_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: ../auth-service
    container_name: auth-service
    restart: always
    depends_on:
      auth-postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://auth-postgres:5432/${AUTH_DB}
      DB_USERNAME: ${AUTH_USER}
      DB_PASSWORD: ${AUTH_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION}
    ports:
      - "8083:8080"
    env_file:
      - .env

  user-postgres:
    image: postgres:16-alpine
    container_name: user-postgres
    restart: always
    environment:
      POSTGRES_DB: ${USER_DB}
      POSTGRES_USER: ${USER_USER}
      POSTGRES_PASSWORD: ${USER_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - user-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_USER} -d ${USER_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-redis:
    image: redis:7-alpine
    container_name: user-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6380:6379"
    volumes:
      - user-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9093,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  user-service:
    build: ../user-service
    container_name: user-service
    restart: always
    depends_on:
      user-postgres:
        condition: service_healthy
      user-redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://user-postgres:5432/${USER_DB}
      DB_USERNAME: ${USER_USER}
      DB_PASSWORD: ${USER_PASSWORD}
      REDIS_HOST: user-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    ports:
      - "8081:8080"
    env_file:
      - .env

  order-postgres:
    image: postgres:16-alpine
    container_name: order-postgres
    restart: always
    environment:
      POSTGRES_DB: ${ORDER_DB}
      POSTGRES_USER: ${ORDER_USER}
      POSTGRES_PASSWORD: ${ORDER_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - order-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDER_USER} -d ${ORDER_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-service:
    build: ../order-service
    container_name: order-service
    restart: always
    depends_on:
      order-postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://order-postgres:5432/${ORDER_DB}
      DB_USERNAME: ${ORDER_USER}
      DB_PASSWORD: ${ORDER_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION}
      USER_SERVICE_URL: http://user-service:8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
    ports:
      - "8082:8080"
    env_file:
      - .env

  payment-mongo:
    image: mongo:4.4
    container_name: payment-mongo
    restart: always
    command: ["--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_INITDB_DATABASE: payment-service
    ports:
      - "27017:27017"
    volumes:
      - payment-mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 10

  payment-mongo-init:
    image: mongo:4.4
    container_name: payment-mongo-init
    depends_on:
      payment-mongo:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      bash -c "
      mongo --host payment-mongo:27017 --eval 'rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"payment-mongo:27017\" }] })' || true
      "

  payment-service:
    build: ../payment-service
    container_name: payment-service
    restart: always
    depends_on:
      payment-mongo-init:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MONGODB_URI: mongodb://payment-mongo:27017/payment-service?replicaSet=rs0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      RANDOM_NUMBER_SERVICE_URL: http://random-number-service:8080
    ports:
      - "8084:8080"
    env_file:
      - .env

  random-number-service:
    image: wiremock/wiremock:3.3.1
    container_name: random-number-service
    restart: always
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings

  gateway:
    build: .
    container_name: gateway
    restart: always
    depends_on:
      - auth-service
      - user-service
      - order-service
      - payment-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      AUTH_SERVICE_URL: http://auth-service:8080
      USER_SERVICE_URL: http://user-service:8080
      ORDER_SERVICE_URL: http://order-service:8080
      PAYMENT_SERVICE_URL: http://payment-service:8080
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    ports:
      - "8080:8080"
    env_file:
      - .env

volumes:
  auth-postgres-data:
  user-postgres-data:
  order-postgres-data:
  user-redis-data:
  payment-mongo-data:

server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${services.auth-service-url}
              predicates:
                - Path=/auth/**
              filters:
                - RewritePath=/auth/(?<segment>.*), /auth/${segment}

            - id: user-service
              uri: ${services.user-service-url}
              predicates:
                - Path=/api/users/**,/api/cards/**

            - id: order-service
              uri: ${services.order-service-url}
              predicates:
                - Path=/api/orders/**


  main:
    web-application-type: reactive

services:
  auth-service-url: http://auth-service:8083
  user-service-url: http://user-service:8081
  order-service-url: http://order-service:8082

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
resilience4j:
  circuitbreaker:
    instances:
      auth-service:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
      user-service:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
  timelimiter:
    instances:
      auth-service:
        timeoutDuration: 5s
      user-service:
        timeoutDuration: 5s
  retry:
    instances:
      user-service-rollback:
        maxAttempts: 3
        waitDuration: 1s
        retryExceptions:
          - java.net.ConnectException
          - org.springframework.web.reactive.function.client.WebClientResponseException.ServiceUnavailable
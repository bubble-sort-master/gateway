spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/auth/**
              filters:
                - RewritePath=/auth/(?<segment>.*), /auth/${segment}

            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/users/**,/api/cards/**

            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/orders/**

services:
  auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8083}
  user-service-url: ${USER_SERVICE_URL:http://localhost:8081}
  order-service-url: ${ORDER_SERVICE_URL:http://localhost:8082}

server:
  port: 0

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${services.auth-service-url}
              predicates:
                - Path=/auth/**
            - id: user-service
              uri: ${services.user-service-url}
              predicates:
                - Path=/api/users/**,/api/cards/**
            - id: order-service
              uri: ${services.order-service-url}
              predicates:
                - Path=/api/orders/**

services:
  auth-service-url: http://localhost:${wiremock.server.port}
  user-service-url: http://localhost:${wiremock.server.port}
  order-service-url: http://localhost:${wiremock.server.port}

jwt:
  secret: test-secret-key-at-least-32-characters-long-for-hmac-sha256
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

resilience4j:
  circuitbreaker:
    instances:
      auth-service:
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
      user-service:
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
  timelimiter:
    instances:
      auth-service:
        timeoutDuration: 2s
      user-service:
        timeoutDuration: 2s
internal:
  secret: test-internal-secret-value